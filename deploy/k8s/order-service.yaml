apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: orderdesk, labels: { app: order-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: order-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: app
          image: ghcr.io/YOUR_GH_USER/orderdesk/order-service:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: orderdesk-config } }]
          env:
            - { name: OTEL_SERVICE_NAME, value: order-service }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: sql-creds, key: username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: sql-creds, key: password } } }
            - { name: SPRING_FLYWAY_ENABLED, value: "false" }      # migrations ran in the Job
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75 -javaagent:/otel/agent.jar" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          # readiness includes DB -> traffic drains during failover; liveness does NOT -> no restart storm
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8080 }, initialDelaySeconds: 40, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: orderdesk }
spec:
  selector: { app: order-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: order-service, namespace: orderdesk }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: order-service } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-service, namespace: orderdesk }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
